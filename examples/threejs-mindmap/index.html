<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WebGL mindmap prototype — Math-Visualization</title>
<style>
  :root{
    --bg:#0b0f16; --panel:#121826; --ink:#e8ecf1; --mute:#8c9aa6; --line:#26303f;
    --yellow:#ffd866;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #stage.grabbing{cursor:grabbing}
  .bar{position:fixed;top:0;left:0;right:0;display:flex;gap:.9rem;align-items:center;
    padding:.6rem .9rem;background:linear-gradient(var(--bg),transparent);pointer-events:none;z-index:3}
  .bar .title{font-weight:600;letter-spacing:.01em}
  .bar .hint{color:var(--mute);font-size:.85rem}
  .bar .spacer{flex:1}
  .bar button{pointer-events:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:.32rem .6rem;font:inherit;font-size:.82rem;cursor:pointer}
  .bar button:hover{border-color:var(--mute)}
  /* Hover/focus card — an HTML overlay, far cheaper than WebGL text. */
  #card{position:fixed;z-index:4;max-width:280px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;
    font-size:.86rem;line-height:1.4;pointer-events:none;opacity:0;transition:opacity 90ms ease;
    box-shadow:0 6px 24px rgba(0,0,0,.45)}
  #card.on{opacity:1}
  #card .csec{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.15rem}
  #card .ctt{color:var(--ink);font-weight:600}
  #card .cmeta{color:var(--mute);font-size:.78rem;margin-top:.2rem}
  #legend{position:fixed;bottom:.6rem;left:.9rem;z-index:3;display:flex;flex-wrap:wrap;gap:.3rem .8rem;
    max-width:60vw;font-size:.74rem;color:var(--mute);pointer-events:none}
  #legend span{display:inline-flex;align-items:center;gap:.32rem}
  #legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  #status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--mute);font-size:1rem;z-index:5}
  .err{max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.2rem 1.4rem}
  .err h2{margin:.2rem 0 .5rem;color:#e07a5f}
</style>
<!-- Concept graph: a <script> sets window.__MVConcepts (works over file:// where fetch() of JSON is blocked). -->
<script src="../../concepts/bundle.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.164.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="bar">
  <span class="title">WebGL mindmap</span>
  <span class="hint" id="hint">drag to pan · scroll to zoom · hover a node · click to focus its neighborhood</span>
  <span class="spacer"></span>
  <button id="btn-reset">Reset view</button>
  <button id="btn-reseed">Reseed layout</button>
</div>
<div id="legend"></div>
<div id="card"></div>
<div id="status">Loading concept graph…</div>

<script type="module">
import * as THREE from 'three';

const statusEl = document.getElementById('status');
function fail(title, msg){
  statusEl.innerHTML = `<div class="err"><h2>${title}</h2><p>${msg}</p></div>`;
}

const D = window.__MVConcepts;
if(!D || !D.index || !D.topics){
  fail('Concept graph not loaded',
    'Expected <code>window.__MVConcepts</code> from <code>../../concepts/bundle.js</code>. ' +
    'Open this file from inside the repo (its path to <code>concepts/bundle.js</code> must resolve), ' +
    'or run a local server at the repo root.');
  throw new Error('no data');
}

/* ---------- palette + sections (mirrors mindmap.html / sections.json) ---------- */
const PALETTE = { b:'#58c4dd', y:'#ffd866', p:'#e07a5f', v:'#b39ddb', g:'#83c167', c:'#7de0d6', o:'#f4a261' };
const sections = (D.sections && D.sections.sections) || [];
const TOPIC_SECTION = {}, SECTION_COLOR = {}, SECTION_LIST = [];
for(const s of sections){
  SECTION_COLOR[s.title] = PALETTE[s.color || 'b'] || '#8c9aa6';
  SECTION_LIST.push(s.title);
  for(const t of (s.topics||[])) TOPIC_SECTION[t] = s.title;
}
const sectionOf = t => TOPIC_SECTION[t] || SECTION_LIST[0] || 'Logic & Foundations';
const capstoneIds = new Set(((D.capstones && D.capstones.capstones) || []).map(c => c.goal));

/* ---------- nodes + edges from the bundle ---------- */
const byId = new Map();
for(const t of D.index.topics.map(k => D.topics[k])){
  if(!t || !t.concepts) continue;
  for(const c of t.concepts){
    if(!byId.has(c.id)) byId.set(c.id, { ...c, topicId: t.topic, topicTitle: t.title });
  }
}
const nodes = [], nodeIndex = new Map();
for(const [id, c] of byId){
  const section = sectionOf(c.topicId);
  nodes.push({ id, title: c.title, topicTitle: c.topicTitle, section,
    color: SECTION_COLOR[section], isCap: capstoneIds.has(id),
    x:0, y:0, vx:0, vy:0, deg:0 });
  nodeIndex.set(id, nodes.length-1);
}
const N = nodes.length;
const edges = [];
const adj = nodes.map(()=>[]);
for(const c of byId.values()){
  const ci = nodeIndex.get(c.id);
  for(const p of (c.prereqs||[])){
    if(!nodeIndex.has(p)) continue;
    const pi = nodeIndex.get(p);
    edges.push([pi, ci, nodes[pi].topicId !== nodes[ci].topicId]);
    adj[ci].push(pi); adj[pi].push(ci);
    nodes[ci].deg++; nodes[pi].deg++;
  }
}
if(!N){ fail('Empty graph', 'The bundle loaded but contains zero concepts.'); throw new Error('empty'); }

/* node radius (world units) — base + log-degree, capstones bumped */
function radius(n){ let r = 5 + Math.min(9, Math.log(1+n.deg)*1.9); return n.isCap ? Math.max(r, 11) : r; }

/* ---------- layout: section-anchored, grid-accelerated force sim ---------- */
const W = 2400, H = 1500;                       // world extent (centered on origin)
const sectionAnchor = new Map();
SECTION_LIST.forEach((title, i) => {
  const a = (2*Math.PI*i)/SECTION_LIST.length - Math.PI/2;
  sectionAnchor.set(title, [Math.cos(a)*W*0.36, Math.sin(a)*H*0.36]);
});
function seedLayout(){
  for(const n of nodes){
    const [ax, ay] = sectionAnchor.get(n.section) || [0,0];
    n.x = ax + (Math.random()-0.5)*260;
    n.y = ay + (Math.random()-0.5)*260;
    n.vx = n.vy = 0;
  }
}
seedLayout();

const CELL = 130;                                // spatial-hash cell for repulsion
let temp = 1;                                    // cooling factor 1→0
function stepLayout(dt){
  // spatial hash
  const grid = new Map();
  const key = (cx,cy)=>cx*100000+cy;
  for(let i=0;i<N;i++){
    const cx = Math.floor(nodes[i].x/CELL), cy = Math.floor(nodes[i].y/CELL);
    const k = key(cx,cy); (grid.get(k) || grid.set(k,[]).get(k)).push(i);
  }
  // repulsion (only same/adjacent cells)
  for(let i=0;i<N;i++){
    const a = nodes[i];
    const cx = Math.floor(a.x/CELL), cy = Math.floor(a.y/CELL);
    for(let gx=cx-1;gx<=cx+1;gx++) for(let gy=cy-1;gy<=cy+1;gy++){
      const cell = grid.get(key(gx,gy)); if(!cell) continue;
      for(const j of cell){
        if(j<=i) continue;
        const b = nodes[j];
        let dx = a.x-b.x, dy = a.y-b.y, d2 = dx*dx+dy*dy;
        if(d2 < 1e-3){ dx = Math.random()-0.5; dy = Math.random()-0.5; d2 = 1; }
        if(d2 > CELL*CELL*4) continue;
        const f = 2600 / d2;
        const inv = f / Math.sqrt(d2);
        a.vx += dx*inv; a.vy += dy*inv; b.vx -= dx*inv; b.vy -= dy*inv;
      }
    }
  }
  // edge springs
  const REST = 90;
  for(const [pi,ci] of edges){
    const a = nodes[pi], b = nodes[ci];
    let dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || 1;
    const f = (d-REST)*0.012;
    const ux = dx/d, uy = dy/d;
    a.vx += ux*f; a.vy += uy*f; b.vx -= ux*f; b.vy -= uy*f;
  }
  // pull toward section anchor (keeps clusters from drifting apart)
  for(const n of nodes){
    const [ax,ay] = sectionAnchor.get(n.section) || [0,0];
    n.vx += (ax-n.x)*0.0016; n.vy += (ay-n.y)*0.0016;
  }
  // integrate + damping + cooling
  const damp = 0.86, cap = 18*temp + 1.5;
  for(const n of nodes){
    n.vx *= damp; n.vy *= damp;
    const sp = Math.hypot(n.vx,n.vy);
    if(sp > cap){ n.vx = n.vx/sp*cap; n.vy = n.vy/sp*cap; }
    n.x += n.vx; n.y += n.vy;
  }
}
// settle synchronously enough to look intentional, then keep cooling live
for(let i=0;i<70;i++){ stepLayout(); temp = Math.max(0, 1 - i/120); }

/* ---------- three.js scene ---------- */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
const scene = new THREE.Scene();

let vw = innerWidth, vh = innerHeight;
const cam = new THREE.OrthographicCamera(-vw/2, vw/2, vh/2, -vh/2, -10, 10);
cam.position.z = 5;
const view = { x:0, y:0, zoom:0.55 };      // current
const target = { x:0, y:0, zoom:0.55 };    // eased toward
function resize(){
  vw = innerWidth; vh = innerHeight;
  renderer.setSize(vw, vh, false);
  cam.left = -vw/2; cam.right = vw/2; cam.top = vh/2; cam.bottom = -vh/2;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* soft radial-gradient sprite for the glow + a crisp core dot */
function discTexture(soft){
  const s = 64, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d');
  const grad = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  if(soft){ grad.addColorStop(0,'rgba(255,255,255,0.9)'); grad.addColorStop(0.4,'rgba(255,255,255,0.35)'); grad.addColorStop(1,'rgba(255,255,255,0)'); }
  else { grad.addColorStop(0,'rgba(255,255,255,1)'); grad.addColorStop(0.7,'rgba(255,255,255,1)'); grad.addColorStop(0.85,'rgba(255,255,255,0.6)'); grad.addColorStop(1,'rgba(255,255,255,0)'); }
  g.fillStyle = grad; g.fillRect(0,0,s,s);
  const tex = new THREE.CanvasTexture(cv); tex.needsUpdate = true; return tex;
}
const glowTex = discTexture(true), coreTex = discTexture(false);

/* node buffers */
const posArr = new Float32Array(N*3);
const colArr = new Float32Array(N*3);      // base section color
const dispCol = new Float32Array(N*3);     // displayed (dimmed on focus)
const sizeArr = new Float32Array(N);
const baseCol = [];
for(let i=0;i<N;i++){
  const n = nodes[i];
  const c = new THREE.Color(n.color); baseCol.push(c);
  colArr[i*3]=c.r; colArr[i*3+1]=c.g; colArr[i*3+2]=c.b;
  dispCol[i*3]=c.r; dispCol[i*3+1]=c.g; dispCol[i*3+2]=c.b;
  sizeArr[i] = radius(n);
}
function makePoints(tex, sizeMul, blending, opacity){
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(dispCol, 3));
  const sz = new Float32Array(N); for(let i=0;i<N;i++) sz[i]=sizeArr[i];
  geo.setAttribute('asize', new THREE.BufferAttribute(sz, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms:{ uTex:{value:tex}, uZoom:{value:view.zoom}, uMul:{value:sizeMul}, uOpacity:{value:opacity} },
    vertexColors:true, transparent:true, depthTest:false, depthWrite:false, blending,
    vertexShader:`
      attribute float asize; varying vec3 vCol;
      uniform float uZoom, uMul;
      void main(){ vCol=color; vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_Position=projectionMatrix*mv;
        // Constant screen-space size (semantic zoom): independent of camera
        // zoom, so zooming spreads the clusters apart while nodes stay readable.
        gl_PointSize = asize * uMul; }`,
    fragmentShader:`
      uniform sampler2D uTex; uniform float uOpacity; varying vec3 vCol;
      void main(){ float a=texture2D(uTex, gl_PointCoord).a;
        if(a<0.01) discard; gl_FragColor=vec4(vCol, a*uOpacity); }`
  });
  return { pts:new THREE.Points(geo, mat), geo, mat, sz };
}
const glow = makePoints(glowTex, 3.6, THREE.AdditiveBlending, 0.5);
const core = makePoints(coreTex, 1.15, THREE.NormalBlending, 1.0);
scene.add(glow.pts); scene.add(core.pts);

/* edges */
const epos = new Float32Array(edges.length*2*3);
const ecol = new Float32Array(edges.length*2*3);
for(let e=0;e<edges.length;e++){
  const cross = edges[e][2];
  const c = cross ? 0.42 : 0.18;
  for(let k=0;k<2;k++){ ecol[(e*2+k)*3]=c; ecol[(e*2+k)*3+1]=c; ecol[(e*2+k)*3+2]=c+ (cross?0.06:0); }
}
const egeo = new THREE.BufferGeometry();
egeo.setAttribute('position', new THREE.BufferAttribute(epos, 3));
egeo.setAttribute('color', new THREE.BufferAttribute(ecol, 3));
const emat = new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:0.5, depthTest:false });
const edgeLines = new THREE.LineSegments(egeo, emat);
scene.add(edgeLines);

function syncPositions(){
  for(let i=0;i<N;i++){ posArr[i*3]=nodes[i].x; posArr[i*3+1]=nodes[i].y; posArr[i*3+2]=0; }
  glow.geo.attributes.position.needsUpdate = true;
  core.geo.attributes.position.needsUpdate = true;
  for(let e=0;e<edges.length;e++){
    const a=nodes[edges[e][0]], b=nodes[edges[e][1]];
    epos[(e*2)*3]=a.x; epos[(e*2)*3+1]=a.y; epos[(e*2)*3+2]=0;
    epos[(e*2+1)*3]=b.x; epos[(e*2+1)*3+1]=b.y; epos[(e*2+1)*3+2]=0;
  }
  egeo.attributes.position.needsUpdate = true;
}

/* ---------- focus / hover ---------- */
let focusIdx = -1;
function setFocus(idx){
  focusIdx = idx;
  const inHood = new Uint8Array(N);
  if(idx>=0){ inHood[idx]=1; for(const j of adj[idx]) inHood[j]=1; }
  for(let i=0;i<N;i++){
    const c = baseCol[i];
    const dim = (idx>=0 && !inHood[i]);
    const f = dim ? 0.16 : 1.0;
    dispCol[i*3]=c.r*f; dispCol[i*3+1]=c.g*f; dispCol[i*3+2]=c.b*f;
  }
  glow.geo.attributes.color.needsUpdate = true;
  core.geo.attributes.color.needsUpdate = true;
  emat.opacity = idx>=0 ? 0.14 : 0.5;
}

/* ---------- camera controls (eased) ---------- */
function clampZoom(z){ return Math.max(0.12, Math.min(6, z)); }
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  // zoom toward cursor
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX-rect.left) - vw/2, my = -((e.clientY-rect.top) - vh/2);
  const wx = view.x + mx/view.zoom, wy = view.y + my/view.zoom;
  const nz = clampZoom(target.zoom * (e.deltaY<0 ? 1.18 : 1/1.18));
  // keep (wx,wy) under the cursor
  target.x = wx - mx/nz; target.y = wy - my/nz; target.zoom = nz;
}, { passive:false });

let drag=null;
canvas.addEventListener('pointerdown', e=>{
  drag = { x:e.clientX, y:e.clientY, vx:target.x, vy:target.y, moved:false, id:e.pointerId };
});
canvas.addEventListener('pointermove', e=>{
  if(drag && e.pointerId===drag.id){
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if(!drag.moved && Math.hypot(dx,dy)>4){ drag.moved=true; canvas.classList.add('grabbing'); try{canvas.setPointerCapture(e.pointerId);}catch(_){} }
    if(drag.moved){ target.x = drag.vx - dx/view.zoom; target.y = drag.vy + dy/view.zoom; }
  } else {
    hover(e.clientX, e.clientY);
  }
});
function endDrag(e){ if(drag && !drag.moved){ /* treat as click */ const i=pick(drag.x,drag.y); setFocus(i); } drag=null; canvas.classList.remove('grabbing'); }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', ()=>{drag=null;canvas.classList.remove('grabbing');});

document.getElementById('btn-reset').onclick = ()=>{ target.x=0; target.y=0; target.zoom=0.55; setFocus(-1); };
document.getElementById('btn-reseed').onclick = ()=>{ seedLayout(); temp=1; reheat=70; };
let reheat = 0;

/* ---------- picking (screen-space nearest within radius) ---------- */
function worldToScreen(wx, wy){
  return [ (wx-view.x)*view.zoom + vw/2, vh/2 - (wy-view.y)*view.zoom ];
}
function pick(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const sx = clientX-rect.left, sy = clientY-rect.top;
  let best=-1, bestD=Infinity;
  for(let i=0;i<N;i++){
    const [px,py] = worldToScreen(nodes[i].x, nodes[i].y);
    const rr = Math.max(8, sizeArr[i]);
    const d = (px-sx)*(px-sx)+(py-sy)*(py-sy);
    if(d < rr*rr && d < bestD){ bestD=d; best=i; }
  }
  return best;
}
const card = document.getElementById('card');
function hover(clientX, clientY){
  const i = pick(clientX, clientY);
  if(i<0){ card.classList.remove('on'); canvas.style.cursor = drag?'grabbing':'grab'; return; }
  const n = nodes[i];
  card.innerHTML = `<div class="csec" style="color:${n.color}">${n.section}</div>`+
    `<div class="ctt">${n.title.replace(/\$([^$]+)\$/g,'$1')}</div>`+
    `<div class="cmeta">${n.topicTitle}${n.isCap?' · capstone':''} · ${n.deg} link${n.deg===1?'':'s'}</div>`;
  card.style.left = Math.min(clientX+14, innerWidth-300)+'px';
  card.style.top = (clientY+14)+'px';
  card.classList.add('on');
  canvas.style.cursor = 'pointer';
}

/* ---------- legend ---------- */
document.getElementById('legend').innerHTML = SECTION_LIST.map(t =>
  `<span><i style="background:${SECTION_COLOR[t]}"></i>${t}</span>`).join('');

/* ---------- render loop ---------- */
statusEl.style.display = 'none';
let coolI = 70;
function animate(){
  requestAnimationFrame(animate);
  // keep simulating gently (cools to a stop; reseed reheats)
  if(reheat>0){ stepLayout(); temp=Math.max(0,1-(70-reheat)/120); reheat--; coolI=0; }
  else if(coolI < 200){ stepLayout(); temp=Math.max(0, 1 - (70+coolI)/260); coolI++; }
  syncPositions();
  // ease camera toward target
  view.x += (target.x-view.x)*0.18;
  view.y += (target.y-view.y)*0.18;
  view.zoom += (target.zoom-view.zoom)*0.18;
  cam.position.x = view.x; cam.position.y = view.y;
  cam.zoom = view.zoom; cam.updateProjectionMatrix();
  glow.mat.uniforms.uZoom.value = view.zoom;
  core.mat.uniforms.uZoom.value = view.zoom;
  renderer.render(scene, cam);
}
animate();
</script>
</body>
</html>
